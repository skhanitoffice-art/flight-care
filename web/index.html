              <details style="background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 10px; padding: 14px 18px;" open>
                <summary style="font-weight: 800; font-size: 15px; color: #0F172A; cursor: pointer;">What is a meet and greet service?</summary>
                <p style="font-size: 14px; color: #475569; line-height: 1.6; margin: 10px 0 0;">A meet and greet service is an airport concierge service where a professional protocol officer receives passengers directly at the terminal (aerobridge exit or curbside drop-off), provides personalized luggage porterage, guides through fast-track immigration and security, and escorts travelers comfortably to their vehicle or connecting flight.</p>

                <summary style="font-weight: 800; font-size: 15px; color: #0F172A; cursor: pointer;">What is meet and greet service at Dhaka airport?</summary>
                <p style="font-size: 14px; color: #475569; line-height: 1.6; margin: 10px 0 0;">Meet and greet service at Dhaka Airport (Hazrat Shahjalal International Airport - HSIA) is a specialized passenger facilitation service provided by Flight Care. Our officer meets arriving or departing passengers with a name placard, guides through priority immigration channels, collects checked baggage from carousels, provides wheelchair assistance if needed, and escorts to parking with a 100% Payment After Service guarantee.</p>

                <p style="font-size: 14px; color: #475569; line-height: 1.6; margin: 10px 0 0;">Meet and greet at the airport is a dedicated VIP assistance service created to eliminate terminal stress. An assigned agent assists passengers through every airport touchpoint—including aerobridge welcome, airline check-in, luggage handling, immigration queue navigation, duty-free shopping, lounge access, and vehicle linkup.</p>
              </details>
              <details style="background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 10px; padding: 14px 18px;">
                <summary style="font-weight: 800; font-size: 15px; color: #0F172A; cursor: pointer;">What is included in meet and greet?</summary>
                <p style="font-size: 14px; color: #475569; line-height: 1.6; margin: 10px 0 0;">Airport meet and greet includes: (1) Personalized name placard reception at the aircraft door / aerobridge or departure drop-off; (2) Fast-track immigration, customs clearance, and visa guidance; (3) Dedicated luggage porter assistance and trolley handling; (4) Wheelchair care for seniors or sick patients; and (5) Escort to executive airport lounges or ground transportation.</p>
              </details>
              <details style="background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 10px; padding: 14px 18px;">
                <summary style="font-weight: 800; font-size: 15px; color: #0F172A; cursor: pointer;">Where will the Flight Care protocol officer meet me?</summary>
                <p style="font-size: 14px; color: #475569; line-height: 1.6; margin: 10px 0 0;">For arriving passengers, our officer greets you at the aerobridge exit or arrival terminal concourse holding a personalized name placard. For departing passengers, the officer meets you curbside at the Terminal 1 or 2 drop-off canopy.</p>
              </details>
              <details style="background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 10px; padding: 14px 18px;">
                <summary style="font-weight: 800; font-size: 15px; color: #0F172A; cursor: pointer;">How does 'Payment After Service' work?</summary>

                <p style="font-size: 14px; color: #475569; line-height: 1.6; margin: 10px 0 0;">Yes, our Wheelchair Escort service is tailored for senior citizens and elderly travelers. A dedicated assistant escorts them smoothly from the aircraft seat through immigration to the car parking area.</p>

              <details style="background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 10px; padding: 14px 18px;">
